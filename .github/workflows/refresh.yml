name: Refresh visa data
on: { schedule: [ { cron: "0 5,17 * * *" } ], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pycountry && python build.py
        env: { ADSENSE_ID: "${{ vars.ADSENSE_ID }}", SITE_URL: "${{ vars.SITE_URL }}", CONTACT_EMAIL: "${{ vars.CONTACT_EMAIL }}" }
      - run: |
          git config user.name "visaradar-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Refresh visa data" && git push)
      - name: Check official links (report only)
        run: python scripts/check_links.py || echo "Some official links need review"
